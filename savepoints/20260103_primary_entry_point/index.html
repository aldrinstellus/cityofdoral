<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City of Doral - Redirecting...</title>
    <meta http-equiv="refresh" content="0; url=/Home/index.html">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #000080 0%, #0000b3 100%);
            color: white;
        }
        .container {
            text-align: center;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 {
            margin: 0 0 10px;
            font-size: 24px;
        }
        p {
            margin: 0;
            opacity: 0.8;
        }
        a {
            color: white;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>City of Doral</h1>
        <p>Redirecting to homepage...</p>
        <p style="margin-top: 20px; font-size: 14px;">
            If you are not redirected, <a href="/Home/index.html">click here</a>.
        </p>
    </div>
    <script>
        // Immediate redirect via JavaScript as backup
        window.location.href = '/Home/index.html';
    </script>
</body>
</html>
